name: 'Local: Bump shared-doc-resources pin'

# Keeps pins/shared-doc-resources.sha pointing at the latest fortify/shared-doc-resources
# commit, via a reviewed PR rather than an automatic push. The pin lives in a plain data
# file (not a workflow file) specifically so this can be a normal contents-write commit:
# GITHUB_TOKEN cannot push changes to files under .github/workflows/ regardless of the
# permissions granted to it (see reusable-update-repo-docs.yml for why the pin isn't
# stored there). Split into a read-only check job and a privileged open-pr job for
# consistency with local-generate-composites.yml's least-privilege pattern.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

env:
  PIN_FILE: pins/shared-doc-resources.sha
  DOC_RESOURCES_REPO: fortify/shared-doc-resources

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_sha: ${{ steps.latest.outputs.sha }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: $/actions/3rdparty/actions/checkout/v6

      - name: Resolve latest shared-doc-resources main SHA
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${DOC_RESOURCES_REPO}/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check whether pin needs updating
        id: diff
        run: |
          new_sha="${{ steps.latest.outputs.sha }}"
          if [ "$(cat "$PIN_FILE")" = "$new_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  open-pr:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: $/actions/3rdparty/actions/checkout/v6

      - name: Update shared-doc-resources pin
        run: echo "${{ needs.check.outputs.new_sha }}" > "$PIN_FILE"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_sha="${{ needs.check.outputs.new_sha }}"
          branch="chore/bump-shared-doc-resources-${new_sha}"
          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qx 0; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git commit -am "chore: bump shared-doc-resources pin to ${new_sha}"
            git push origin "HEAD:${branch}"
            gh pr create \
              --title "chore: bump shared-doc-resources pin to ${new_sha}" \
              --body "Updates ${PIN_FILE} to the latest commit on ${DOC_RESOURCES_REPO}'s main branch. Review the shared-doc-resources diff for any unexpected script/template/include changes before merging." \
              --base main
          fi
