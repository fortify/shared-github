name: 'Reusable: Bump shared-github pin'

# GITHUB_TOKEN cannot push changes to files under .github/workflows/ regardless of the
# permissions granted to it (a deliberate GitHub restriction, not something a permissions:
# block can lift), and pinned SHAs must live inline in `uses:` lines (GitHub disallows
# expressions/variables there), so this cannot open a PR automatically the way
# local-bump-shared-doc-resources-pin.yml does for its plain-file pin. Instead: detect
# whether an update is needed, generate a patch, upload it as a build artifact, and fail
# the job so it's clearly visible. A human with normal push rights (not subject to this
# GITHUB_TOKEN restriction) downloads the patch, applies it, and pushes/opens a PR.

on:
  workflow_call:
    inputs:
      shared-repo:
        description: 'owner/repo of the shared-github repo to pin to'
        type: string
        default: fortify/shared-github

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/actions/3rdparty/actions/checkout/v6

      - name: Resolve latest shared-github main SHA
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ inputs.shared-repo }}/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update pinned SHA references
        id: update
        run: |
          repo="${{ inputs.shared-repo }}"
          new_sha="${{ steps.latest.outputs.sha }}"
          changed=0
          while IFS= read -r -d '' f; do
            if grep -qE "${repo}/[^@[:space:]]+@[0-9a-f]{40}" "$f"; then
              sed -i -E "s#(${repo}/[^@[:space:]]+@)[0-9a-f]{40}#\1${new_sha}#g" "$f"
              changed=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Generate patch
        if: steps.update.outputs.changed == '1'
        run: git diff > shared-github-pin-bump.patch

      - name: Upload patch
        if: steps.update.outputs.changed == '1'
        uses: $/actions/3rdparty/actions/upload-artifact/v7
        with:
          name: shared-github-pin-bump.patch
          path: shared-github-pin-bump.patch
          retention-days: 14

      - name: Fail with apply instructions
        if: steps.update.outputs.changed == '1'
        run: |
          new_sha="${{ steps.latest.outputs.sha }}"
          {
            echo "### shared-github pin bump available"
            echo "A newer commit (\`${new_sha}\`) is available on \`${{ inputs.shared-repo }}\`."
            echo "Download the \`shared-github-pin-bump.patch\` artifact from this run, then:"
            echo '```'
            echo "git checkout -b chore/bump-shared-github-${new_sha}"
            echo "git apply shared-github-pin-bump.patch"
            echo "git commit -am 'chore: bump shared-github pin to ${new_sha}'"
            echo "git push -u origin HEAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::A newer fortify/shared-github commit (${new_sha}) is available; see the job summary and shared-github-pin-bump.patch artifact for how to apply it. This cannot be pushed automatically because GITHUB_TOKEN cannot modify files under .github/workflows/."
          exit 1
