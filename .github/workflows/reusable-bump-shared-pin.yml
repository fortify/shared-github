name: 'Reusable: Bump shared-github pin'

# GITHUB_TOKEN cannot push changes to files under .github/workflows/ regardless of the
# permissions granted to it (a deliberate GitHub restriction, not something a permissions:
# block can lift), and pinned SHAs must live inline in `uses:` lines (GitHub disallows
# expressions/variables there), so this cannot open a PR automatically the way
# local-bump-shared-doc-resources-pin.yml does for its plain-file pin. Instead: detect
# whether an update is needed, print the diff (small: a handful of SHA replacements) as a
# copy/paste-able block in the job summary, and fail the job so it's clearly visible. A
# human with normal push rights (not subject to this GITHUB_TOKEN restriction) pastes and
# applies it, then pushes/opens a PR.

on:
  workflow_call:
    inputs:
      shared-repo:
        description: 'owner/repo of the shared-github repo to pin to'
        type: string
        default: fortify/shared-github

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/actions/3rdparty/actions/checkout/v6

      - name: Resolve latest shared-github main SHA
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ inputs.shared-repo }}/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update pinned SHA references
        id: update
        run: |
          repo="${{ inputs.shared-repo }}"
          new_sha="${{ steps.latest.outputs.sha }}"
          while IFS= read -r -d '' f; do
            if grep -qE "${repo}/[^@[:space:]]+@[0-9a-f]{40}" "$f"; then
              sed -i -E "s#(${repo}/[^@[:space:]]+@)[0-9a-f]{40}#\1${new_sha}#g" "$f"
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          # Base "changed" on whether content actually differs, not just on whether a
          # matching reference was found (a match with the identical SHA is a no-op).
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail with copy/paste apply instructions
        if: steps.update.outputs.changed == '1'
        run: |
          new_sha="${{ steps.latest.outputs.sha }}"
          {
            echo "### shared-github pin bump available"
            echo "A newer commit (\`${new_sha}\`) is available on \`${{ inputs.shared-repo }}\`. Run the following locally to apply it:"
            echo '```bash'
            echo "git checkout -b chore/bump-shared-github-${new_sha}"
            echo "git apply <<'PATCH_EOF'"
            git diff
            echo 'PATCH_EOF'
            echo "git commit -am 'chore: bump shared-github pin to ${new_sha}'"
            echo "git push -u origin HEAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::A newer fortify/shared-github commit (${new_sha}) is available; see the job summary for a copy/paste-able diff and apply instructions. This cannot be pushed automatically because GITHUB_TOKEN cannot modify files under .github/workflows/."
          exit 1
