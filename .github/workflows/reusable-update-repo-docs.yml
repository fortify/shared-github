name: 'Reusable: Update repo docs'

# Fetches update-doc-resources.sh (and the templates/includes it references) from a
# fixed commit of fortify/shared-doc-resources, rather than executing whatever is
# currently on that repo's main branch. The pinned commit SHA lives in pins/shared-doc-resources.sha
# (a plain data file, not a workflow file) so local-bump-shared-doc-resources-pin.yml can update it
# with a plain contents-write commit; GITHUB_TOKEN cannot push changes to files under
# .github/workflows/ directly, which is why the pin isn't stored in this file.

on:
  workflow_call:

jobs:
  update-repo-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: $/actions/3rdparty/actions/checkout/v6
        with:
          ref: ${{ github.head_ref }}

      - name: Update documentation resources
        env:
          DOC_RESOURCES_DIR: ${{ github.workspace }}/doc-resources
        run: |
          SHARED_DOC_RESOURCES_REF=$(curl -sfL "https://raw.githubusercontent.com/fortify/shared-github/main/pins/shared-doc-resources.sha")
          export SHARED_DOC_RESOURCES_REF
          source <(curl -sfL "https://raw.githubusercontent.com/fortify/shared-doc-resources/${SHARED_DOC_RESOURCES_REF}/scripts/update-doc-resources.sh")

      - uses: $/actions/3rdparty/peter-evans/create-pull-request/v8
        with:
          commit-message: 'docs: Auto-update documentation resources'
          branch: auto-doc-updates
          delete-branch: true
          title: 'Update documentation resources'
          labels: |
            automated pr
            documentation
