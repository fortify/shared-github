# Reusable workflow file for running Fortify on Demand SAST & Debricked scans if the following secrets are available:
# - OSS_FOD_TENANT
# - OSS_FOD_USER
# - OSS_FOD_PASSWORD
# These secrets are managed at github.com/fortify/fortify organization level, but may need to be granted access to for
# repositories that need to be scanned, and pull requests generated from forks will not have access to those secrets.
# In such cases, the FoD scan will be skipped without errors.

name: 'Reusable: Fortify on Demand Scan'

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to set up (e.g. 17, 21). Leave empty to skip Java setup.'
        type: string
        required: false
      node-version:
        description: 'Node.js version to set up (e.g. 20). Leave empty to skip Node.js setup.'
        type: string
        required: false
      dotnet-version:
        description: '.NET version to set up (e.g. 8.0). Leave empty to skip .NET setup.'
        type: string
        required: false
      debug:
        description: 'Whether to generate & collect fcli debug artifacts; note that these may contain sensitive data like access tokens or credentials. Automatically enabled when workflow is re-run with "Enable debug logging" checked.'
        type: boolean
        required: false
        default: false
    secrets:
      OSS_FOD_TENANT:
        required: false
      OSS_FOD_USER:
        required: false
      OSS_FOD_PAT:
        required: false

jobs:
  checkSecrets:
    runs-on: ubuntu-latest
    steps:
    - name: Check Secrets
      shell: bash
      run: |
        if [[ -z "${OSS_FOD_TENANT}" || -z "${OSS_FOD_USER}" || -z "${OSS_FOD_PASSWORD}" ]]; then
          echo "::notice ::Not running FoD scan as OSS_FOD_TENANT, OSS_FOD_USER, and/or OSS_FOD_PASSWORD secrets haven't been defined"
        else
          echo DO_FOD_SCAN=true >> $GITHUB_ENV
        fi
      env:
        OSS_FOD_TENANT: ${{secrets.OSS_FOD_TENANT}}
        OSS_FOD_USER: ${{secrets.OSS_FOD_USER}}
        OSS_FOD_PASSWORD: ${{secrets.OSS_FOD_PAT}}
    outputs:
      DO_FOD_SCAN: ${{ env.DO_FOD_SCAN }}
              
  FoD-SAST-Scan:
    runs-on: ubuntu-latest
    needs: checkSecrets
    if: needs.checkSecrets.outputs.DO_FOD_SCAN
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check Out Source Code
        uses: $/actions/3rdparty/actions/checkout/v6

      - name: Setup Java
        if: inputs.java-version != ''
        uses: $/actions/3rdparty/actions/setup-java/v5
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: $/actions/3rdparty/actions/setup-node/v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup .NET
        if: inputs.dotnet-version != ''
        uses: $/actions/3rdparty/actions/setup-dotnet/v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Bootstrap fcli directly via npx instead of fortify/github-action, which pulls in
      # version-pinned (non-SHA) internal action references we can't yet get rid of; see
      # https://github.com/fortify/github-action/issues/92
      - name: Bootstrap fcli
        shell: bash
        run: |
          npx @fortify/setup@2 env init --tools=fcli:bootstrapped
          npx @fortify/setup@2 env github

      - name: Set Fortify data directory
        shell: bash
        run: echo "FORTIFY_DATA_DIR=${RUNNER_TEMP}/fortify-data" >> "$GITHUB_ENV"

      - name: Run FoD SAST scan
        shell: bash
        run: |
          mkdir -p "${FORTIFY_DATA_DIR}" && cd "${FORTIFY_DATA_DIR}"
          fcli action run ci --debug=${{ inputs.debug || runner.debug == '1' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOD_URL: https://ams.fortify.com/
          FOD_TENANT: ${{secrets.OSS_FOD_TENANT}}
          FOD_USER: ${{secrets.OSS_FOD_USER}}
          FOD_PASSWORD: ${{secrets.OSS_FOD_PAT}}
          FOD_LOGIN_EXTRA_OPTS: --socket-timeout=600s
          DO_SCA_SCAN: true
          DO_AVIATOR_AUDIT: true
          OVERRIDE_SAST_SETTINGS: true
          SETUP_EXTRA_OPTS: --sdlc-status Development --scan-types sast

      - name: Upload debug artifacts
        if: ${{ always() && (inputs.debug || runner.debug == '1') }}
        uses: $/actions/3rdparty/actions/upload-artifact/v7
        with:
          name: fortify-debug-artifacts-${{ github.job }}
          path: ${{ env.FORTIFY_DATA_DIR }}
          retention-days: 1
