name: 'Local: Generate third-party composite actions'

on:
  workflow_dispatch:

env:
  # Where scripts/generate.js writes composite wrapper actions, relative to the repo root.
  OUTPUT_DIR: actions/3rdparty

jobs:
  # Runs the generator (and its npm dependencies) with no git-push/PR permissions at all,
  # so a compromised generate.js/dependency cannot push commits or open PRs.
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Remove existing wrapper actions
        run: rm -rf "$OUTPUT_DIR"

      - name: Run generator
        env:
          ORG: ${{ github.repository_owner }}
          # GitHub App credentials (required): set these repository secrets
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: node ./scripts/generate.js

      - name: Verify generated diff stays within ${{ env.OUTPUT_DIR }}/**
        id: diff
        run: |
          out_of_scope=$(git status --porcelain | awk '{print $2}' | grep -v "^${OUTPUT_DIR}/" || true)
          if [ -n "$out_of_scope" ]; then
            echo "::error::Generator touched files outside ${OUTPUT_DIR}/**:"
            echo "$out_of_scope"
            exit 1
          fi
          if git status --porcelain -- "$OUTPUT_DIR" | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated wrapper actions
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-wrapper-actions
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 1

  # Only this job can push/open a PR; it runs no generator code, only git/gh commands
  # against the artifact the generate job already produced and scope-checked.
  open-pr:
    needs: generate
    if: needs.generate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove existing wrapper actions
        run: rm -rf "$OUTPUT_DIR"

      - name: Download generated wrapper actions
        uses: actions/download-artifact@v8
        with:
          name: generated-wrapper-actions
          path: ${{ env.OUTPUT_DIR }}

      - name: Commit changes to branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git checkout -b "chore/update-generated-actions-${{ github.run_id }}"
          git add -A
          git commit -m "chore: update generated composite actions"
          git push origin "HEAD:chore/update-generated-actions-${{ github.run_id }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore: update generated composite actions" \
            --body "Automated regeneration of wrapper actions from the org allow-list. Review the diff for any unexpected upstream/ref changes before merging." \
            --base main \
            --head "chore/update-generated-actions-${{ github.run_id }}"
