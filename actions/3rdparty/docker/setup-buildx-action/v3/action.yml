name: docker/setup-buildx-action (wrapped) v3
description: >-
  Composite wrapper for docker/setup-buildx-action pinned to
  8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
inputs:
  version:
    description: Buildx version. (eg. v0.3.0)
    required: false
  driver:
    description: Sets the builder driver to be used
    required: false
    default: docker-container
  driver-opts:
    description: >-
      List of additional driver-specific options. (eg.
      image=moby/buildkit:master)
    required: false
  buildkitd-flags:
    description: BuildKit daemon flags
    required: false
  buildkitd-config:
    description: BuildKit daemon config file
    required: false
  buildkitd-config-inline:
    description: Inline BuildKit daemon config
    required: false
  use:
    description: Switch to this builder instance
    required: false
    default: 'true'
  name:
    description: >-
      Name of the builder. If not specified, one will be generated or if it
      already exists, it will be used instead of creating a new one.
    required: false
  endpoint:
    description: Optional address for docker socket or context from `docker context ls`
    required: false
  platforms:
    description: >-
      Fixed platforms for current node. If not empty, values take priority over
      the detected ones
    required: false
  append:
    description: Append additional nodes to the builder
    required: false
  keep-state:
    description: >-
      Keep BuildKit state on cleanup. This is only useful on persistent
      self-hosted runners.
    required: false
    default: 'false'
  cache-binary:
    description: Cache buildx binary to GitHub Actions cache backend
    required: false
    default: 'true'
  cleanup:
    description: Cleanup temp files and remove builder at the end of a job
    required: false
    default: 'true'
outputs:
  name:
    description: Builder name
    value: ${{ steps.upstream.outputs.name }}
  driver:
    description: Builder driver
    value: ${{ steps.upstream.outputs.driver }}
  platforms:
    description: Builder node platforms (preferred or available)
    value: ${{ steps.upstream.outputs.platforms }}
  nodes:
    description: Builder nodes metadata
    value: ${{ steps.upstream.outputs.nodes }}
  endpoint:
    description: Builder node endpoint (deprecated, use nodes output instead)
    value: ${{ steps.upstream.outputs.endpoint }}
  status:
    description: Builder node status (deprecated, use nodes output instead)
    value: ${{ steps.upstream.outputs.status }}
  flags:
    description: Builder node flags (deprecated, use nodes output instead)
    value: ${{ steps.upstream.outputs.flags }}
  all_upstream_outputs:
    description: All outputs from upstream step as JSON
    value: ${{ toJSON(steps.upstream.outputs) }}
runs:
  using: composite
  steps:
    - id: upstream
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        version: ${{ inputs.version }}
        driver: ${{ inputs.driver }}
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkitd-config: ${{ inputs.buildkitd-config }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
        use: ${{ inputs.use }}
        name: ${{ inputs.name }}
        endpoint: ${{ inputs.endpoint }}
        platforms: ${{ inputs.platforms }}
        append: ${{ inputs.append }}
        keep-state: ${{ inputs.keep-state }}
        cache-binary: ${{ inputs.cache-binary }}
        cleanup: ${{ inputs.cleanup }}
