name: fortify/github-action (wrapped) v3
description: >-
  Composite wrapper for fortify/github-action pinned to
  0540f6aefd95d12a5fbed40f406d825fad64330e
inputs:
  debug:
    description: >-
      Whether to generate & collect debug artifacts; note that these may contain
      sensitive data like access tokens or credentials. Automatically enabled
      when workflow is re-run with "Enable debug logging" checked.
    required: false
    default: 'false'
  debug-artifact-name:
    description: >-
      Name for the debug artifacts archive; defaults to
      "fortify-debug-artifacts"
    required: false
    default: fortify-debug-artifacts
  debug-retention-days:
    description: >-
      Number of days to retain debug artifacts; defaults to 1 due to sensitivity
      of data
    required: false
    default: '1'
outputs:
  all_upstream_outputs:
    description: All outputs from upstream step as JSON
    value: ${{ toJSON(steps.upstream.outputs) }}
runs:
  using: composite
  steps:
    - id: upstream
      uses: fortify/github-action@0540f6aefd95d12a5fbed40f406d825fad64330e
      with:
        debug: ${{ inputs.debug }}
        debug-artifact-name: ${{ inputs.debug-artifact-name }}
        debug-retention-days: ${{ inputs.debug-retention-days }}
