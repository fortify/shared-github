name: actions/setup-java (wrapped) v5
description: >-
  Composite wrapper for actions/setup-java pinned to
  b6effb05e454b25005698d916606bdc6ffcbf961
inputs:
  java-version:
    description: >-
      The Java version to set up. Takes a whole or semver Java version. See
      examples of supported syntax in README file
    required: false
  java-version-file:
    description: >-
      The path to a file containing the Java version to set up (.java-version,
      .tool-versions, .sdkmanrc). Used when java-version is not set. See
      examples of supported syntax in README file
    required: false
  distribution:
    description: >-
      Java distribution. See the list of supported distributions in README file.
      Legacy AdoptOpenJDK values (adopt, adopt-hotspot, adopt-openj9) are
      deprecated and will be removed in setup-java v6. This input is required
      except when java-version-file points to .sdkmanrc with a recognized
      distribution suffix (e.g., java=21.0.5-tem).
    required: false
  java-package:
    description: The package type (jdk, jre, jdk+fx, jre+fx, jdk+crac, jre+crac)
    required: false
    default: jdk
  architecture:
    description: >-
      The architecture of the package (defaults to the action runner's
      architecture)
    required: false
  jdk-file:
    description: Path to where the compressed JDK is located
    required: false
  check-latest:
    description: >-
      Set this option if you want the action to check for the latest available
      version that satisfies the version spec
    required: false
    default: false
  set-default:
    description: >-
      Set this option to false if you want to install a JDK but not make it the
      default. When false, JAVA_HOME and PATH are not updated, but
      JAVA_HOME_<major>_<arch> is still set.
    required: false
    default: true
  verify-signature:
    description: >-
      Verify downloaded Java package signatures when supported by the selected
      distribution
    required: false
    default: false
  verify-signature-public-key:
    description: >-
      ASCII-armored GPG public key used to verify the downloaded package
      signature. Overrides the default bundled key for the selected
      distribution.
    required: false
  server-id:
    description: >-
      ID of the distributionManagement repository in the pom.xml file. Default
      is `github`
    required: false
    default: github
  server-username:
    description: >-
      Environment variable name for the username for authentication to the
      Apache Maven repository. Default is $GITHUB_ACTOR
    required: false
    default: GITHUB_ACTOR
  server-password:
    description: >-
      Environment variable name for password or token for authentication to the
      Apache Maven repository. Default is $GITHUB_TOKEN
    required: false
    default: GITHUB_TOKEN
  settings-path:
    description: Path to where the settings.xml file will be written. Default is ~/.m2.
    required: false
  overwrite-settings:
    description: Overwrite the settings.xml file if it exists. Default is "true".
    required: false
    default: true
  gpg-private-key:
    description: GPG private key to import. Default is empty string.
    required: false
    default: ''
  gpg-passphrase:
    description: >-
      Environment variable name for the GPG private key passphrase. Defaults to
      GPG_PASSPHRASE when gpg-private-key is set; ignored otherwise.
    required: false
  cache:
    description: >-
      Name of the build platform to cache dependencies. It can be "maven",
      "gradle" or "sbt".
    required: false
  cache-dependency-path:
    description: >-
      The path to a dependency file: pom.xml, build.gradle, build.sbt, etc. This
      option can be used with the `cache` option. If this option is omitted, the
      action searches for the dependency file in the entire repository. This
      option supports wildcards and a list of file names for caching multiple
      dependencies.
    required: false
  job-status:
    description: >-
      Workaround to pass job status to post job step. This variable is not
      intended for manual setting
    required: false
    default: ${{ job.status }}
  token:
    description: >-
      The token used to authenticate when fetching version manifests hosted on
      github.com, such as for the Microsoft Build of OpenJDK. When running this
      action on github.com, the default value is sufficient. When running on
      GHES, you can pass a personal access token for github.com if you are
      experiencing rate limiting.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  mvn-toolchain-id:
    description: >-
      Name of Maven Toolchain ID if the default name of
      "${distribution}_${java-version}" is not wanted. See examples of supported
      syntax in Advanced Usage file
    required: false
  mvn-toolchain-vendor:
    description: >-
      Name of Maven Toolchain Vendor if the default name of "${distribution}" is
      not wanted. See examples of supported syntax in Advanced Usage file
    required: false
  show-download-progress:
    description: >-
      Whether Maven should print artifact download/transfer progress to the
      build log. When "false" (default) the action sets "-ntp"
      (--no-transfer-progress) in MAVEN_ARGS to produce cleaner logs. Set to
      "true" to keep the progress output. Has no effect on non-Maven builds.
    required: false
    default: false
outputs:
  distribution:
    description: Distribution of Java that has been installed
    value: ${{ steps.upstream.outputs.distribution }}
  version:
    description: Actual version of the java environment that has been installed
    value: ${{ steps.upstream.outputs.version }}
  path:
    description: Path to where the java environment has been installed (same as $JAVA_HOME)
    value: ${{ steps.upstream.outputs.path }}
  cache-hit:
    description: A boolean value to indicate an exact match was found for the primary key
    value: ${{ steps.upstream.outputs.cache-hit }}
  cache-primary-key:
    description: >-
      The primary cache key computed by the action for the configured build
      tool. Empty when caching is not enabled or when caching is skipped (e.g.
      cache service unavailable). Useful for composing with actions/cache or
      actions/cache/restore across jobs.
    value: ${{ steps.upstream.outputs.cache-primary-key }}
  all_upstream_outputs:
    description: All outputs from upstream step as JSON
    value: ${{ toJSON(steps.upstream.outputs) }}
runs:
  using: composite
  steps:
    - id: upstream
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: ${{ inputs.java-version }}
        java-version-file: ${{ inputs.java-version-file }}
        distribution: ${{ inputs.distribution }}
        java-package: ${{ inputs.java-package }}
        architecture: ${{ inputs.architecture }}
        jdk-file: ${{ inputs.jdk-file }}
        check-latest: ${{ inputs.check-latest }}
        set-default: ${{ inputs.set-default }}
        verify-signature: ${{ inputs.verify-signature }}
        verify-signature-public-key: ${{ inputs.verify-signature-public-key }}
        server-id: ${{ inputs.server-id }}
        server-username: ${{ inputs.server-username }}
        server-password: ${{ inputs.server-password }}
        settings-path: ${{ inputs.settings-path }}
        overwrite-settings: ${{ inputs.overwrite-settings }}
        gpg-private-key: ${{ inputs.gpg-private-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        job-status: ${{ inputs.job-status }}
        token: ${{ inputs.token }}
        mvn-toolchain-id: ${{ inputs.mvn-toolchain-id }}
        mvn-toolchain-vendor: ${{ inputs.mvn-toolchain-vendor }}
        show-download-progress: ${{ inputs.show-download-progress }}
